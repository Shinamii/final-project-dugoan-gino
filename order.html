<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Order Type</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <section id="categories">
    <button type="button" id="category-noodles">
        <img src="images/noodles.jpeg" alt="Noodles">
        <span>Noodles</span>
    </button>

    <button type="button" id="category-drinks">
        <img src="images/drinks.jpeg" alt="Drinks">
        <span>Drinks</span>
    </button>

    <button type="button" id="category-desserts">
        <img src="images/dessert.jpeg" alt="Desserts">
        <span>Desserts</span>
    </button>
    </section>
    <fieldset>
        <legend>Choose your order type</legend>

        <div>
            <input type="radio" id="dine-in" name="orderType" value="dine-in">
            <label for="dine-in">Dine-in</label>
        </div>

        <div>
            <input type="radio" id="take-out" name="orderType" value="take-out">
            <label for="take-out">Take-out</label>
        </div>

        <div>
            <input type="radio" id="delivery" name="orderType" value="delivery">
            <label for="delivery">Delivery</label>
        </div>
    </fieldset>

    <div id="address-section" hidden>
        <label for="address">Delivery address</label>
        <input type="text" id="address" name="address">
    </div>

    <fieldset>
    <legend>Choose your noodles</legend>

    <div>
        <input type="radio" id="buldak-original" name="noodle" value="buldak-original">
        <label for="buldak-original">Buldak Original <span id="buldak-original-stock"></span></label>
    </div> 

    <div>
        <input type="radio" id="buldak-carbonara" name="noodle" value="buldak-carbonara">
        <label for="buldak-carbonara">Buldak Carbonara <span id="buldak-carbonara-stock"></span></label>
    </div>

    <div>
        <input type="radio" id="chapagetti" name="noodle" value="chapagetti">
        <label for="chapagetti">Chapagetti <span id="chapagetti-stock"></span></label>
    </div>
    </fieldset>

    <fieldset>
    <legend>Choose your spice level</legend>

    <div>
        <input type="radio" id="mild" name="spice" value="mild" disabled>
        <label for="mild">Mild</label>
    </div>

    <div>
        <input type="radio" id="medium" name="spice" value="medium" disabled>
        <label for="medium">Medium</label>
    </div>

    <div>
        <input type="radio" id="hot" name="spice" value="hot" disabled>
        <label for="hot">Hot</label>
    </div>

    <div>
        <input type="radio" id="extra-hot" name="spice" value="extra-hot" disabled>
        <label for="extra-hot">Extra Hot</label>
    </div>

    <div>
        <input type="radio" id="extreme" name="spice" value="extreme" disabled>
        <label for="extreme">Extreme</label>
    </div>
</fieldset>

    <fieldset>
    <legend>Choose your add-ons (optional)</legend>

    <div>
        <input type="checkbox" id="egg" name="addon" value="egg">
        <label for="egg">Egg <span id="egg-stock"></span></label>
    </div>

    <div>
        <input type="checkbox" id="cheese" name="addon" value="cheese">
        <label for="cheese">Cheese <span id="cheese-stock"></span></label>
    </div>

    <div>
        <input type="checkbox" id="ham" name="addon" value="ham">
        <label for="ham">Ham <span id="ham-stock"></span></label>
    </div>

    <div>
        <input type="checkbox" id="sausage" name="addon" value="sausage">
        <label for="sausage">Sausage <span id="sausage-stock"></span></label>
    </div>

    <div>
        <input type="checkbox" id="corn" name="addon" value="corn">
        <label for="corn">Corn <span id="corn-stock"></span></label>
    </div>

    <div>
        <input type="checkbox" id="dumplings" name="addon" value="dumplings">
        <label for="dumplings">Dumplings <span id="dumplings-stock"></span></label>
    </div>
</fieldset>

    <button type="button" id="place-order">Place Order</button>

     <p id="message"></p>
     <p id="order-summary"></p>
     <p id="address-summary"></p>
     <p id="addon-summary"></p>
     <p id="noodle-summary"></p>
     <p id="spice-summary"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
